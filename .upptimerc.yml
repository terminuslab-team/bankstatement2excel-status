owner: terminuslab-team # GitHub organization where this repository lives
repo: bankstatement2excel-status # The name of this repository
user-agent: terminuslab-team

# No repository secrets are used by the checks below (strict allowlist)
secrets: []

sites:
  - name: API
    url: https://api.bankstatement2excel.com/api/v1/utils/health-check/
    expectedStatusCodes:
      - 200
    __dangerous__body_down_if_text_missing: "true"
  - name: Website
    url: https://bankstatement2excel.com
    expectedStatusCodes:
      - 200
  - name: Converter
    url: https://bankstatement2excel.com/converter
    expectedStatusCodes:
      - 200

assignees:
  - hzcheney

# The monitoring token is scoped without repository Administration access,
# so skip the cosmetic repo topic/homepage updates instead of failing them.
skipTopicsUpdate: true
skipHomepageUpdate: true

# Offsets avoid GitHub's congested top-of-the-hour scheduling slots.
workflowSchedule:
  uptime: "3-59/5 * * * *"
  responseTime: "17 23 * * *"
  graphs: "13 0 * * *"
  summary: "23 0 * * *"
  staticSite: "37 1 * * *"
  updateTemplate: "43 0 * * *"
  updates: "47 3 * * *"

# Attribute generated commits to an organization member so that GitHub
# associates the scheduled workflows with an account that has repo access.
commitMessages:
  commitAuthorName: hzcheney
  commitAuthorEmail: 32014404+hzcheney@users.noreply.github.com

status-website:
  baseUrl: /bankstatement2excel-status
  name: BankStatement2Excel Status
  introTitle: "**BankStatement2Excel** service status"
  introMessage: Live availability and response times for the BankStatement2Excel website, converter and API.
  navbar:
    - title: Status
      href: /
    - title: BankStatement2Excel
      href: https://bankstatement2excel.com
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
